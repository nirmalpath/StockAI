name: Python CI

on:

  push:

    branches:
      - main

  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pip install -r requirements-dev.txt

      - run: black --check src tests

      - run: ruff check src tests

      - run: pytest