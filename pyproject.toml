[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stockai"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]